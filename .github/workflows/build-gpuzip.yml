name: Build GPUZIP OneFile Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CUDA/**"
      - ".github/workflows/build-gpuzip.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show .NET info
        run: dotnet --info

      - name: Build reliable WinUI payload
        shell: pwsh
        working-directory: CUDA
        run: ./build-release.ps1

      - name: Smoke-test WinUI startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "CUDA/release/GPUZIP-win-x64/GpuZip.App.exe"
          Write-Host "Starting GUI smoke test: $exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8

          if ($p.HasExited) {
            $code = $p.ExitCode
            $log = Join-Path $env:LOCALAPPDATA "GPUZIP/app-startup.log"
            if (Test-Path $log) {
              Write-Host "--- app-startup.log ---"
              Get-Content $log
            }
            throw "GpuZip.App.exe exited during startup smoke test with code $code"
          }

          Write-Host "GUI remained alive for 8 seconds; startup smoke test passed."
          Stop-Process -Id $p.Id -Force

      - name: Pack WinUI payload
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path "CUDA/release/GPUZIP-win-x64"
          $payload = "CUDA/src/GpuZip.Launcher/payload.zip"
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $payload -CompressionLevel Optimal
          $p = Get-Item $payload
          Write-Host "Embedded payload: $($p.FullName)"
          Write-Host "Payload size: $($p.Length) bytes"

      - name: Build self-extracting OneFile launcher
        shell: pwsh
        run: |
          $outDir = "artifact"
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet publish "CUDA/src/GpuZip.Launcher/GpuZip.Launcher.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $outDir
          if ($LASTEXITCODE -ne 0) { throw "OneFile launcher publish failed" }

          $exe = Get-Item "$outDir/GPUZIP.exe"
          Write-Host "Final executable: $($exe.FullName)"
          Write-Host "Final size: $($exe.Length) bytes"

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: artifact/GPUZIP.exe

      - name: Upload OneFile executable
        uses: actions/upload-artifact@v4
        with:
          name: GPUZIP-OneFile-win-x64
          path: artifact/GPUZIP.exe
          if-no-files-found: error
          retention-days: 30
