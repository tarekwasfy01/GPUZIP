name: Build GPUZIP OneFile Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CUDA/**"
      - ".github/workflows/build-gpuzip.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show .NET info
        run: dotnet --info

      - name: Build release
        shell: pwsh
        working-directory: CUDA
        run: ./build-release.ps1

      - name: Prepare OneFile artifact
        shell: pwsh
        run: |
          $releaseDir = "CUDA/release/GPUZIP-win-x64"
          $outDir = "artifact"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exe = Get-ChildItem -Path $releaseDir -Filter "GpuZip.App.exe" -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | Where-Object { $_.Name -ne "7zz.exe" } | Select-Object -First 1
          }
          if (-not $exe) {
            throw "No application executable was produced."
          }

          Copy-Item -LiteralPath $exe.FullName -Destination "$outDir/GPUZIP.exe" -Force
          $final = Get-Item "$outDir/GPUZIP.exe"
          Write-Host "Final OneFile executable: $($final.FullName)"
          Write-Host "Size: $($final.Length) bytes"

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: artifact/GPUZIP.exe

      - name: Upload OneFile executable
        uses: actions/upload-artifact@v4
        with:
          name: GPUZIP-OneFile-win-x64
          path: artifact/GPUZIP.exe
          if-no-files-found: error
          retention-days: 30
