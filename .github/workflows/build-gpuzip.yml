name: Build GPUZIP OneFile Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CUDA/**"
      - ".github/workflows/build-gpuzip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build release
        shell: pwsh
        working-directory: CUDA
        run: ./build-release.ps1

      - name: Collect OneFile EXE
        shell: pwsh
        run: |
          $publish = "CUDA/release/GPUZIP-win-x64"
          $exe = Get-ChildItem -Path $publish -Filter "GpuZip.App.exe" -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $publish -Filter "*.exe" -File |
              Where-Object { $_.Name -ne "7zz.exe" } |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }
          if (-not $exe) {
            throw "No GPUZIP executable was produced."
          }

          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          Copy-Item $exe.FullName "artifact/GPUZIP.exe" -Force

          Write-Host "OneFile executable: $($exe.FullName)"
          Write-Host "Artifact: artifact/GPUZIP.exe"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Verify OneFile artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "artifact/GPUZIP.exe")) {
            throw "GPUZIP.exe is missing."
          }
          $files = @(Get-ChildItem "artifact" -File)
          if ($files.Count -ne 1) {
            throw "Artifact directory must contain exactly one file."
          }

      - name: Upload GPUZIP OneFile EXE
        uses: actions/upload-artifact@v4
        with:
          name: GPUZIP-OneFile-win-x64
          path: artifact/GPUZIP.exe
          if-no-files-found: error
          retention-days: 30
